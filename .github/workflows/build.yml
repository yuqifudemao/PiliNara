name: Build

on:
  # pull_request:
  #     types:
  #         - opened
  #         - synchronize
  #         - reopened
  #         - ready_for_review
  #     paths-ignore:
  #         - "**.md"
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android"
        required: false
        default: true
        type: boolean
      build_ios:
        description: "Build iOS"
        required: false
        default: false
        type: boolean
      build_mac:
        description: "Build Mac"
        required: false
        default: false
        type: boolean
      build_win_x64:
        description: "Build Win-x64"
        required: false
        default: false
        type: boolean
      build_win_x64_newlibmpv:
        description: "Build Win-x64 (NewLibmpv)"
        required: false
        default: false
        type: boolean
      build_linux_x64:
        description: "Build Linux-x64"
        required: false
        default: false
        type: boolean
      tag:
        description: "tag"
        required: false
        default: ""
        type: string

jobs:
  android:
    if: ${{ (github.event_name == 'pull_request' && github.repository == 'Starfallan/PiliNara') || github.event.inputs.build_android == 'true' }}
    name: Release Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Load persistent Android signing key
        if: github.event_name == 'workflow_dispatch'
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_SHA256 }}
        shell: bash
        run: |
          for name in SIGN_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD ANDROID_SIGNING_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Android signing configuration: $name"
              exit 1
            fi
          done
          if [[ ! "$ANDROID_SIGNING_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::ANDROID_SIGNING_SHA256 must be a SHA-256 fingerprint without colons"
            exit 1
          fi
          umask 077
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          escape_property() {
            local value="${1//\\/\\\\}"
            printf '%s' "${value// /\\ }"
          }
          {
            printf 'storeFile=key.jks\n'
            printf 'storePassword=%s\n' "$(escape_property "$KEYSTORE_PASSWORD")"
            printf 'keyAlias=%s\n' "$(escape_property "$KEY_ALIAS")"
            printf 'keyPassword=%s\n' "$(escape_property "$KEY_PASSWORD")"
          } > android/key.properties

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Flutter Build Release Apk
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

      - name: Flutter Build Dev Apk
        if: ${{ github.event_name == 'pull_request' }}
        run: flutter build apk --release --split-per-abi --android-project-arg dev=1 --pub

      - name: Rename APKs
        shell: bash
        run: |
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
            mv "$file" "PiliNara_android_${{ env.version }}_${abi}.apk"
          done

      - name: Sign and verify Android release APKs
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_SHA256 }}
        shell: bash
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          for apk in PiliNara_android_*.apk; do
            "$apksigner" sign --ks android/app/key.jks --ks-type PKCS12 \
              --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD --out "$apk.signed" "$apk"
            certificates=$("$apksigner" verify --print-certs "$apk.signed")
            fingerprint=$(awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print tolower($NF)}' <<< "$certificates")
            if [[ "$fingerprint" != "${ANDROID_SIGNING_SHA256,,}" ]]; then
              echo "::error::Unexpected signing certificate for $apk"
              exit 1
            fi
            mv "$apk.signed" "$apk"
          done

      - name: Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: PiliNara_android_*.apk

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android_arm64-v8a
          path: PiliNara_android_*_arm64-v8a.apk

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android_armeabi-v7a
          path: PiliNara_android_*_armeabi-v7a.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android_x86_64
          path: PiliNara_android_*_x86_64.apk

  ios:
    if: ${{ (github.event_name == 'pull_request' && github.repository == 'Starfallan/PiliNara') || github.event.inputs.build_ios == 'true' }}
    uses: ./.github/workflows/ios.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  mac:
    if: ${{ github.event.inputs.build_mac == 'true' }}
    uses: ./.github/workflows/mac.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  win_x64:
    if: ${{ (github.event_name == 'pull_request' && github.repository == 'Starfallan/PiliNara') || github.event.inputs.build_win_x64 == 'true' }}
    uses: ./.github/workflows/win_x64.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  win_x64_newlibmpv:
    if: ${{ github.event.inputs.build_win_x64_newlibmpv == 'true' }}
    uses: ./.github/workflows/win_x64_newlibmpv.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  linux_x64:
    if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
    uses: ./.github/workflows/linux_x64.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
